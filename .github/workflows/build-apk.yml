name: Build Chatix Debug APK

on:
  workflow_dispatch:
  push:
    branches: [develop, main, master]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  JAVA_VERSION: '21'

jobs:
  build:
    name: Build Chatix (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4

      - name: Initialize accessible submodules, de-register inaccessible ones
        run: |
          export GIT_TERMINAL_PROMPT=0
          export GIT_SSH_COMMAND="ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          if [ ! -f .gitmodules ]; then
            echo "No .gitmodules found, nothing to do."
            exit 0
          fi
          git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | while read -r key path; do
            name="${key#submodule.}"
            name="${name%.path}"
            echo "::group::Submodule '${name}' (${path})"
            if timeout 180 git submodule update --init --depth 1 -- "${path}"; then
              echo "Initialized '${name}'."
            else
              echo "::warning::Submodule '${name}' is not accessible. De-registering it."
              git submodule deinit -f -- "${path}" 2>/dev/null || true
              rm -rf ".git/modules/${name}" || true
              git config --local --remove-section "submodule.${name}" 2>/dev/null || true
              rm -rf "${path}" || true
              mkdir -p "${path}"
            fi
            echo "::endgroup::"
          done
          git submodule status || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Rebrand app name to Chatix
        run: |
          find . \( -name .git -o -name build -o -name .gradle -o -name node_modules -o -name .github \) -type d -prune -o \
            -type f \( -name 'strings.xml' -o -name 'localazy.xml' \) \
            -exec sed -i -E 's/\bElement X\b/Chatix/g; s/\bElement\b/Chatix/g' {} + || true

          find . \( -name .git -o -name build -o -name .gradle -o -name node_modules -o -name .github \) -type d -prune -o \
            -type f \( -name 'BuildTimeConfig.kt' -o -name 'build.gradle.kts' -o -name 'build.gradle' \) \
            -exec sed -i -E 's/"Element X\b/"Chatix/g; s/"Element\b/"Chatix/g' {} + || true

      - name: Replace launcher icons with logo.png
        run: |
          if [ ! -f logo.png ]; then
            echo "::error::logo.png was not found in the repository root."
            exit 1
          fi
          declare -A DENSITIES=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )

          TARGETS="$(
            {
              echo "app/src/main/res"
              find app/src -path '*/res/mipmap-*/ic_launcher*' -not -path '*/build/*' 2>/dev/null \
                | sed -E 's#/mipmap-[^/]*/[^/]*$##' || true
            } | sort -u
          )"
          while IFS= read -r RES; do
            if [ -z "${RES}" ]; then
              continue
            fi
            echo "Updating launcher icons in ${RES}"
            for density in "${!DENSITIES[@]}"; do
              size="${DENSITIES[$density]}"
              dir="${RES}/mipmap-${density}"
              mkdir -p "${dir}"
              for icon in ic_launcher ic_launcher_round; do
                if ! { command -v convert > /dev/null 2>&1 && convert logo.png -resize "${size}x${size}" "${dir}/${icon}.png"; }; then
                  cp -f logo.png "${dir}/${icon}.png"
                fi
              done
            done
            find "${RES}" -path '*/mipmap-anydpi*' \( -name 'ic_launcher.xml' -o -name 'ic_launcher_round.xml' \) -delete || true
            find "${RES}" -path '*/mipmap-*' \( -name 'ic_launcher.webp' -o -name 'ic_launcher_round.webp' \) -delete || true
          done <<< "${TARGETS}"

      - name: Hardcode homeserver URL (chat.deducia.com)
        run: |
          find . \( -name .git -o -name build -o -name .gradle -o -name node_modules -o -name .github \) -type d -prune -o \
            -type f \( -name '*.kt' -o -name '*.java' -o -name '*.xml' -o -name '*.json' -o -name '*.gradle' -o -name '*.kts' \) \
            -exec sed -i 's#https://matrix\.org#https://chat.deducia.com#g' {} + || true

          find . \( -name .git -o -name build -o -name .gradle -o -name node_modules -o -name .github \) -type d -prune -o \
            -type f -name '*.kt' \
            -exec sed -i 's#"matrix\.org"#"chat.deducia.com"#g' {} + || true

      - name: Replace matrix.to share links
        run: |
          grep -rIlZ -F 'https://matrix.to' \
            --exclude-dir=.git --exclude-dir=build --exclude-dir=.gradle \
            --exclude-dir=.github --exclude-dir=node_modules . \
            | xargs -0 -r sed -i 's#https://matrix\.to#https://chat.deducia.com#g' || true

      - name: Build Gplay Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleGplayDebug --stacktrace --no-daemon --no-configuration-cache

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chatix-Debug-APK
          path: app/build/outputs/apk/gplay/debug/*.apk
          if-no-files-found: error
          retention-days: 14
